name: Chimera CI base image

# Builds ghcr.io/srdicov/noctalia-chimera-ci:latest with the full Chimera
# toolchain + deps baked in. Runs on plain Ubuntu (JS actions work here),
# unlike the containerized build job.
on:
  workflow_dispatch:
  push:
    paths:
      - "ci/Dockerfile.chimera-ci"
      - ".github/workflows/ci-base.yml"

permissions:
  packages: write

jobs:
  base:
    name: Build and push CI base image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/Dockerfile.chimera-ci
          push: true
          tags: ghcr.io/srdicov/noctalia-chimera-ci:latest
