name: Chimera Linux (musl) build

on:
  push:
    branches: [main, "chimera/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build on chimeralinux/chimera:latest
    runs-on: ubuntu-latest
    container:
      image: chimeralinux/chimera:latest
    steps:
      - name: Install git for checkout
        run: apk update && apk add git

      - name: Checkout sources (git, no Node in container)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA"

      - name: Install build dependencies
        run: |
          apk update
          apk add \
            clang cmake meson ninja pkgconf \
            elogind elogind-devel \
            wayland-devel wayland-protocols \
            mesa-devel libepoxy-devel \
            freetype-devel fontconfig-devel \
            cairo-devel pango-devel harfbuzz-devel \
            libxkbcommon-devel glib-devel \
            libsecret-devel libsodium-devel \
            pipewire-devel wireplumber-devel \
            polkit-devel linux-pam linux-pam-devel \
            curl curl-devel libwebp-devel libjxl-devel \
            libsndfile-devel librsvg-devel \
            libqalculate-devel libxml2-devel \
            md4c-devel libical-devel \
            nlohmann-json stb

      - name: Build and install sdbus-c++ (elogind backend)
        run: |
          git clone --depth 1 --branch v2.0.0 https://github.com/Kistler-Group/sdbus-cpp.git
          cmake -S sdbus-cpp -B sdbus-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DSDBUSCPP_SDBUS_LIB=elogind \
            -DBUILD_TESTS=OFF
          cmake --build sdbus-build -j "$(nproc)"
          cmake --install sdbus-build
          pkg-config --modversion sdbus-c++

      - name: Vendor tomlplusplus + stb headers (absent on Chimera)
        run: |
          dl() {
            if command -v wget >/dev/null; then wget -qO "$2" "$1";
            elif command -v curl >/dev/null; then curl -sfL -o "$2" "$1";
            else fetch -o "$2" "$1"; fi
          }
          mkdir -p /usr/include/toml++ /usr/include/stb /usr/lib/pkgconfig
          dl https://raw.githubusercontent.com/marzer/tomlplusplus/v3.4.0/toml.hpp \
            /usr/include/toml++/toml.hpp
          if [ ! -f /usr/include/stb/stb_image_resize2.h ]; then
            dl https://raw.githubusercontent.com/nothings/stb/master/stb_image_resize2.h \
              /usr/include/stb/stb_image_resize2.h
          fi
          if [ ! -f /usr/include/stb/stb_image_write.h ]; then
            dl https://raw.githubusercontent.com/nothings/stb/master/stb_image_write.h \
              /usr/include/stb/stb_image_write.h
          fi
          printf '%s\n' \
            'prefix=/usr' \
            'exec_prefix=${prefix}' \
            'libdir=${prefix}/lib' \
            'includedir=${prefix}/include' \
            '' \
            'Name: tomlplusplus' \
            'Description: TOML library for C++ (vendored single header for Chimera CI)' \
            'Version: 3.4.0' \
            'Cflags: -I${includedir}' \
            > /usr/lib/pkgconfig/tomlplusplus.pc
          pkg-config --modversion tomlplusplus

      - name: Configure (release, musl)
        env:
          CC: clang
          CXX: clang++
        run: >
          meson setup build
          --buildtype=release
          -Djemalloc=disabled
          -Dtests=disabled
          --prefix=/usr/local

      - name: Build noctalia
        env:
          CC: clang
          CXX: clang++
        run: meson compile -C build noctalia
