name: Chimera Linux (musl) build

on:
  push:
    branches: [main, "chimera/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build on prebaked Chimera CI image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/srdicov/noctalia-chimera-ci:latest
    steps:
      - name: Install git + jq + bsdtar for checkout/upload
        run: apk update && apk add git jq libarchive-progs

      - name: Checkout sources (git, no Node in container)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA"

      - name: Configure (release, musl)
        run: >
          meson setup build
          --buildtype=release
          -Djemalloc=disabled
          -Dtests=disabled
          --prefix=/usr/local

      - name: Build noctalia
        run: meson compile -C build noctalia

      - name: Package install tree
        run: |
          DESTDIR="$PWD/pkg" meson install -C build --no-rebuild
          # Bundle source-built sdbus-c++ (not in any Chimera repo) so the
          # tarball is self-contained on a fresh system.
          mkdir -p pkg/usr/local/lib
          cp -P /usr/lib/libsdbus-c++.so* pkg/usr/local/lib/
          tar -czf noctalia-chimera-x86_64.tar.gz -C pkg usr
          ls -lh noctalia-chimera-x86_64.tar.gz

      - name: Publish GitHub Release asset (REST, no JS actions in container)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="chimera-build-$(echo "$GITHUB_SHA" | cut -c1-7)"
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GITHUB_TOKEN"
          # Delete previous release with same tag if re-run.
          OLD_ID=$(curl -sf -H "$AUTH" "$API/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -n "$OLD_ID" ]; then
            curl -sf -X DELETE -H "$AUTH" "$API/releases/$OLD_ID" > /dev/null
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
          fi
          REL_JSON=$(curl -sf -H "$AUTH" -H "Accept: application/vnd.github+json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Chimera musl build $TAG\",\"body\":\"Automated Chimera Linux (musl/x86_64) build of noctalia. Unpack at / .\"}" \
            "$API/releases")
          UPLOAD_URL=$(echo "$REL_JSON" | jq -r '.upload_url' | sed 's/{.*//')
          curl -sf -H "$AUTH" -H "Content-Type: application/gzip" \
            --data-binary @noctalia-chimera-x86_64.tar.gz \
            "$UPLOAD_URL?name=noctalia-chimera-x86_64.tar.gz"
          echo "Published $TAG"
